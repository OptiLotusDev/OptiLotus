# .github/workflows/ci-tests.yml
name: Common CI Quality Testing Gate

on:
  pull_request:
    branches: [ master ]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Common & Desktop Tests
        # Runs commonTest, desktopTest, and local androidTest
        run: ./gradlew check