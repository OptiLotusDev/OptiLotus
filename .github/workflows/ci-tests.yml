name: Common CI Quality Testing Gate

on:
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-matrix:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "Linux & Common"
            os: ubuntu-latest
            task: "./gradlew :shared:allTests -Pkotlin.native.ignoreDisabledTargets=true"
          - target: "macOS & iOS"
            os: macos-latest
            task: "./gradlew :shared:allTests"

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.2.0

      - name: Run Target Tests
        run: ${{ matrix.task }}