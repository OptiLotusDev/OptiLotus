name: Common CI Quality Testing Gate

on:
  pull_request:
    branches: [ master ]

jobs:
  test-matrix:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Keeps other jobs running if one fails
      matrix:
        include:
          - target: "Desktop & Common"
            os: ubuntu-latest
            task: "./gradlew desktopTest commonTest"

          - target: "macOS & iOS"
            os: macos-latest
            task: "./gradlew macosX64Test macosArm64Test iosSimulatorArm64Test"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Handles Gradle wrapper setup and optimal dependency/build caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: ${{ matrix.task }}