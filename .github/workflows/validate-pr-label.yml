name: Validate PR Release Label

on:
  pull_request:
    types: [opened, labeled, unlabeled]

concurrency:
  group: validate-label-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check-release-label:
    name: Require Release Label
    runs-on: ubuntu-latest
    steps:
      - name: Verify Release Label Selection
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          # Parse exact string matches safely using jq to avoid shell injection and regex false positives
          HAS_PATCH=$(echo "$LABELS_JSON" | jq -r 'contains(["patch"])')
          HAS_MINOR=$(echo "$LABELS_JSON" | jq -r 'contains(["minor"])')
          HAS_MAJOR=$(echo "$LABELS_JSON" | jq -r 'contains(["major"])')
          HAS_SKIP=$(echo "$LABELS_JSON" | jq -r 'contains(["skip release"])')

          COUNT=0
          [ "$HAS_PATCH" = "true" ] && COUNT=$((COUNT + 1))
          [ "$HAS_MINOR" = "true" ] && COUNT=$((COUNT + 1))
          [ "$HAS_MAJOR" = "true" ] && COUNT=$((COUNT + 1))
          [ "$HAS_SKIP" = "true" ] && COUNT=$((COUNT + 1))

          if [ $COUNT -eq 0 ]; then
            echo "::error::PR is missing a release label! Apply exactly ONE of: 'patch', 'minor', 'major', or 'skip release'."
            exit 1
          elif [ $COUNT -gt 1 ]; then
            echo "::error::PR has multiple release labels applied! Select ONLY ONE."
            exit 1
          else
            echo "Valid release label configured correctly."
          fi