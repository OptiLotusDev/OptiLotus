name: Build Release Artifacts

on:
  release:
    types: [published]

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-desktop-and-apple:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            task: packageDeb
            artifact_src: "desktopApp/build/compose/binaries/main/deb/*.deb"
            artifact_name: "OptiLotus-linux-x64.deb"
          - os: ubuntu-26.04-arm
            platform: linux
            arch: arm64
            task: packageDeb
            artifact_src: "desktopApp/build/compose/binaries/main/deb/*.deb"
            artifact_name: "OptiLotus-linux-arm64.deb"
          - os: windows-latest
            platform: windows
            arch: x64
            task: packageMsi
            artifact_src: "desktopApp/build/compose/binaries/main/msi/*.msi"
            artifact_name: "OptiLotus-windows-x64.msi"
          - os: macos-26
            platform: macos
            arch: arm64
            task: packageDmg
            artifact_src: "desktopApp/build/compose/binaries/main/dmg/*.dmg"
            artifact_name: "OptiLotus-macos-arm64.dmg"
          - os: macos-26-intel
            platform: macos
            arch: x64
            task: packageDmg
            artifact_src: "desktopApp/build/compose/binaries/main/dmg/*.dmg"
            artifact_name: "OptiLotus-macos-x64.dmg"

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.2.0

      - name: Build Package
        shell: bash
        run: ./gradlew :desktopApp:${{ matrix.task }} -PversionName="${GITHUB_REF_NAME#v}"

      - name: Rename Artifact for Unique Upload
        shell: bash
        run: |
          FILE=$(ls ${{ matrix.artifact_src }} | head -n 1)
          cp "$FILE" "./${{ matrix.artifact_name }}"

      - name: Upload Artifact to Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: ./${{ matrix.artifact_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.2.0

      - name: Compute Version from Tag
        id: ver
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      # Signing uses keystore/keystore.properties checked out from the repo, shared by the whole team.
      - name: Build Release APK
        run: |
          ./gradlew :androidApp:assembleRelease \
            -PversionCode=${{ steps.ver.outputs.version_code }} \
            -PversionName=${{ steps.ver.outputs.version_name }}

      - name: Locate and Rename Release APK
        run: |
          APK_FILE=$(find . -type f -name "*.apk" | grep -i "release" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No release APK found!"
            exit 1
          fi
          cp "$APK_FILE" ./OptiLotus-android-release.apk

      - name: Upload Android APK to Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: OptiLotus-android-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios-framework:
    name: Build iOS Framework Zip
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.2.0

      - name: Build XCFramework
        run: ./gradlew :shared:assembleSharedXCFramework

      - name: Zip XCFramework
        run: |
          cd shared/build/XCFrameworks/release
          zip -ry ../../../../OptiLotus-ios-xcframework.zip Shared.xcframework

      - name: Upload iOS Framework to Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: OptiLotus-ios-xcframework.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    name: Build Web (WASM) Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.2.0

      - name: Build WASM Distribution
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Zip Web Distribution
        run: |
          cd webApp/build/dist/wasmJs
          zip -r ../../../../OptiLotus-web-wasm.zip productionExecutable

      - name: Upload Web Distribution to Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: OptiLotus-web-wasm.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
