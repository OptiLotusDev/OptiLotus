name: Build and Upload Release Artifacts

on:
  release:
    types: [published]

jobs:
  # ── 1. Android APK Build (minSdk 21 / Android 7+) ─────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Release APK
        run: ./gradlew :composeApp:assembleRelease

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: composeApp/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. iOS Build (Unsigned Framework Zip) ────────────
  build-ios:
    runs-on: macos-14 # Apple Silicon macOS runner
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build iOS App via xcodebuild
        run: |
          xcodebuild -workspace iosApp/iosApp.xcworkspace \
                     -scheme iosApp \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath iosApp/build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO

      - name: Package iOS Build Artifact (.zip)
        run: |
          cd iosApp/build/Build/Products/Release-iphoneos
          zip -r ../../../../ios-release-build.zip iosApp.app

      - name: Upload iOS Zip to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ios-release-build.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Desktop Native Packaging (Win, Mac, Linux x64/ARM64/x86) ──
  build-desktop-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - name: "windows-x64"
            os: windows-latest
            java-arch: "x64"
            java-dist: "temurin"
            artifact-pattern: "composeApp/build/compose/binaries/main/msi/*.msi"
            cmd: "./gradlew packageMsi"

          # Windows ARM64
          - name: "windows-arm64"
            os: windows-latest
            java-arch: "x64"
            java-dist: "temurin"
            artifact-pattern: "composeApp/build/compose/binaries/main/msi/*.msi"
            cmd: "./gradlew packageMsi -PtargetArch=arm64"

          # Windows x86 (32-bit legacy)
          - name: "windows-x86"
            os: windows-latest
            java-arch: "x86"
            java-dist: "zulu" # Zulu supports 32-bit Windows JDKs
            artifact-pattern: "composeApp/build/compose/binaries/main/msi/*.msi"
            cmd: "./gradlew packageMsi -PtargetArch=x86"

          # macOS Intel x64
          - name: "macos-x64"
            os: macos-13
            java-arch: "x64"
            java-dist: "temurin"
            artifact-pattern: "composeApp/build/compose/binaries/main/dmg/*.dmg"
            cmd: "./gradlew packageDmg"

          # macOS Apple Silicon ARM64
          - name: "macos-arm64"
            os: macos-14
            java-arch: "aarch64"
            java-dist: "temurin"
            artifact-pattern: "composeApp/build/compose/binaries/main/dmg/*.dmg"
            cmd: "./gradlew packageDmg"

          # Linux x64
          - name: "linux-x64"
            os: ubuntu-latest
            java-arch: "x64"
            java-dist: "temurin"
            artifact-pattern: "composeApp/build/compose/binaries/main/deb/*.deb"
            cmd: "./gradlew packageDeb"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: ${{ matrix.java-dist }}
          architecture: ${{ matrix.java-arch }}
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build Native Distribution
        run: ${{ matrix.cmd }}

      - name: Upload Artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-pattern }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Linux ARM64 (Raspberry Pi / Linux ARM via QEMU Docker) ──
  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3

      - name: Build Linux ARM64 Native Package in Docker Container
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v ${{ github.workspace }}:/work \
            -w /work \
            eclipse-temurin:17-jdk-noble \
            bash -c "chmod +x gradlew && ./gradlew packageDeb"

      - name: Upload Linux ARM64 .deb
        uses: softprops/action-gh-release@v2
        with:
          files: composeApp/build/compose/binaries/main/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}